name: Publish verified Windows Themes
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: Wodecj/ClashMetaForWindows
      BUILD_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify successful build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9.-]*$ ]]
          test "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$BUILD_RUN_ID" --json workflowName --jq .workflowName)" = 'Windows Themes'
          gh run view "$BUILD_RUN_ID" --json headSha --jq .headSha > build-sha.txt
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$(cat build-sha.txt)"
          gh run download "$BUILD_RUN_ID" -D artifacts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, json
          root=Path('artifacts')
          dist=Path('release-assets'); dist.mkdir()
          sha=Path('build-sha.txt').read_text().strip()
          for target in ['aarch64-pc-windows-msvc','x86_64-pc-windows-msvc']:
              folder=root/f'Windows-Themes-{target}'
              assert (folder/'SOURCE_COMMIT.txt').read_text(encoding='utf-8-sig').strip()==sha
              sums=folder/f'SHA256SUMS-{target}.txt'
              for line in sums.read_text(encoding='utf-8-sig').splitlines():
                  digest,name=line.split('  ',1)
                  assert Path(name).name==name
                  assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest
              installers=list(folder.glob('*-setup.exe'))
              assert len(installers)==1 and installers[0].stat().st_size>1_000_000
              for file in folder.iterdir():
                  name=file.name
                  if name.startswith('SHA256SUMS-'): continue
                  if file.suffix=='.exe': name=name.replace(' ','.')
                  if name=='THIRD-PARTY-VERSIONS.json': name=f'THIRD-PARTY-VERSIONS-{target}.json'
                  dest=dist/name
                  if dest.exists(): assert dest.read_bytes()==file.read_bytes()
                  else: shutil.copyfile(file,dest)
          PY
      - name: Include corresponding third-party sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, re, zipfile, hashlib, tarfile
          dist=Path('release-assets')
          refs=set()
          for file in dist.glob('THIRD-PARTY-VERSIONS-*.json'):
              versions=json.loads(file.read_text())
              for key in ['META_VERSION','META_ALPHA_VERSION']:
                  version=versions[key]['version']
                  ref=version
                  if key=='META_ALPHA_VERSION':
                      match=re.search(r'([0-9a-f]{7,40})$', version)
                      assert match, version
                      ref=match.group(1)
                  refs.add(('MetaCubeX/mihomo',ref))
          with zipfile.ZipFile(dist/'Clash-Verge-Themes-source.zip') as archive:
              manifest=archive.read('src-tauri/Cargo.toml').decode()
          line=next(line for line in manifest.splitlines() if line.startswith('clash_verge_service_ipc ='))
          version=re.search(r'version\s*=\s*"([^"]+)"',line).group(1)
          refs.add(('clash-verge-rev/clash-verge-service-ipc','v'+version))
          sources=[]
          for repo,ref in sorted(refs):
              commit=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/commits/{ref}']))['sha']
              name=f'{repo.split("/")[-1]}-{commit}-source.tar.gz'
              with (dist/name).open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{repo}/tarball/{commit}'],stdout=stream,check=True)
              with tarfile.open(dist/name,'r:gz') as archive:
                  assert len(archive.getmembers())>10
              sources.append({'repository':repo,'ref':ref,'commit':commit,'archive':name})
          (dist/'THIRD-PARTY-SOURCES.json').write_text(json.dumps(sources,indent=2)+'\n')
          (dist/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in sorted(dist.iterdir()) if f.name!='SHA256SUMS.txt'))
          PY
      - name: Upload verified installers and sources
        run: gh release upload "$RELEASE_TAG" --clobber release-assets/*
